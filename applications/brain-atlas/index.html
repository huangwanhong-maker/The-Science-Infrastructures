<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Brain Atlas</title>
  <meta name="description" content="The human brain in the round: its cortex by lobe and gyrus, its deep nuclei, ventricles and fibre bundles, each with its anatomy; sections, atlases, and data mapped onto it.">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M9 24c-3 0-5-2.4-5-5.2 0-1.6.7-3 1.8-3.9C5.3 14 5 13 5 12c0-2.4 1.9-4.3 4.2-4.3.3-2.2 2.1-3.9 4.4-3.9 1.3 0 2.4.5 3.2 1.4.8-.9 1.9-1.4 3.2-1.4 2.3 0 4.1 1.7 4.4 3.9C26.1 7.7 28 9.6 28 12c0 1-.3 2-.8 2.9 1.1.9 1.8 2.3 1.8 3.9 0 2.8-2.2 5.2-5 5.2' fill='none' stroke='%23ca8dbe' stroke-width='1.8' stroke-linejoin='round'/%3E%3Cpath d='M16 5.5v18.5M16 24l-2.5 4M16 24l2.5 4' fill='none' stroke='%23e8c3dc' stroke-width='1.4'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" media="print" onload="this.media='all'"
        href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,300..700;1,8..60,300..600&display=swap">
  <link rel="stylesheet" href="styles.css">
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
        "three-mesh-bvh": "https://cdn.jsdelivr.net/npm/three-mesh-bvh@0.8.3/build/index.module.js"
      }
    }
  </script>
  <script type="module" src="src/app.js"></script>
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="mark" viewBox="0 0 32 32">
        <path d="M9 24c-3 0-5-2.4-5-5.2 0-1.6.7-3 1.8-3.9C5.3 14 5 13 5 12c0-2.4 1.9-4.3 4.2-4.3.3-2.2 2.1-3.9 4.4-3.9 1.3 0 2.4.5 3.2 1.4.8-.9 1.9-1.4 3.2-1.4 2.3 0 4.1 1.7 4.4 3.9C26.1 7.7 28 9.6 28 12c0 1-.3 2-.8 2.9 1.1.9 1.8 2.3 1.8 3.9 0 2.8-2.2 5.2-5 5.2" fill="none" stroke="#ca8dbe" stroke-width="1.8" stroke-linejoin="round"/>
        <path d="M16 5.5v18.5M16 24l-2.5 4M16 24l2.5 4" fill="none" stroke="#e8c3dc" stroke-width="1.4"/>
      </symbol>
      <symbol id="i-eye" viewBox="0 0 16 16"><path d="M1.5 8s2.4-4.5 6.5-4.5S14.5 8 14.5 8 12.1 12.5 8 12.5 1.5 8 1.5 8z" fill="none" stroke="currentColor" stroke-width="1.2"/><circle cx="8" cy="8" r="2" fill="currentColor"/></symbol>
      <symbol id="i-eye-off" viewBox="0 0 16 16"><path d="M1.5 8s2.4-4.5 6.5-4.5S14.5 8 14.5 8 12.1 12.5 8 12.5 1.5 8 1.5 8z" fill="none" stroke="currentColor" stroke-width="1.2" opacity=".45"/><path d="M3 13L13 3" stroke="currentColor" stroke-width="1.2"/></symbol>
      <symbol id="i-chev" viewBox="0 0 16 16"><path d="M6 4l4 4-4 4" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-search" viewBox="0 0 16 16"><circle cx="7" cy="7" r="4.5" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M10.5 10.5L14 14" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></symbol>
      <symbol id="i-close" viewBox="0 0 16 16"><path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></symbol>
      <symbol id="i-focus" viewBox="0 0 16 16"><path d="M2 5.5V2h3.5M10.5 2H14v3.5M14 10.5V14h-3.5M5.5 14H2v-3.5" fill="none" stroke="currentColor" stroke-width="1.3"/><circle cx="8" cy="8" r="2" fill="currentColor"/></symbol>
      <symbol id="i-isolate" viewBox="0 0 16 16"><circle cx="8" cy="8" r="5.5" fill="none" stroke="currentColor" stroke-width="1.2" stroke-dasharray="2 1.6"/><circle cx="8" cy="8" r="2.4" fill="currentColor"/></symbol>
      <symbol id="i-slices" viewBox="0 0 16 16"><rect x="2" y="2" width="12" height="12" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.2"/><path d="M8 2v12M2 8h12" stroke="currentColor" stroke-width="1"/></symbol>
      <symbol id="i-hide" viewBox="0 0 16 16"><path d="M1.5 8s2.4-4.5 6.5-4.5S14.5 8 14.5 8 12.1 12.5 8 12.5 1.5 8 1.5 8z" fill="none" stroke="currentColor" stroke-width="1.2"/><path d="M3 13L13 3" stroke="currentColor" stroke-width="1.2"/></symbol>
    </defs>
  </svg>

  <header class="top">
    <div class="brand">
      <svg class="mark" aria-hidden="true"><use href="#mark"/></svg>
      <div class="brand-text"><span class="brand-name">Brain Atlas</span><span class="brand-sub">the human brain, MNI 152 ICBM 2009c</span></div>
    </div>
    <nav class="modes" role="tablist" aria-label="Mode">
      <button type="button" role="tab" data-mode="anatomy">Anatomy</button>
      <button type="button" role="tab" data-mode="sections">Sections</button>
      <button type="button" role="tab" data-mode="atlases">Atlases</button>
      <button type="button" role="tab" data-mode="data">Data</button>
      <button type="button" role="tab" data-mode="head">Head</button>
    </nav>
    <div class="top-right">
      <label class="search" aria-label="Find a structure">
        <svg aria-hidden="true"><use href="#i-search"/></svg>
        <input type="search" id="find" placeholder="Find a structure…" autocomplete="off" spellcheck="false">
        <div id="find-results" class="find-results" hidden></div>
      </label>
      <button type="button" class="link" id="tours-link">Tours</button>
      <button type="button" class="link" id="about-link">About</button>
    </div>
  </header>

  <main>
    <aside id="left" class="panel"></aside>

    <section id="stage">
      <div id="viewport">
        <canvas id="gl"></canvas>
        <svg id="plate" aria-hidden="true"></svg>
        <div id="plate-labels" aria-hidden="true"></div>
        <div id="tip" hidden></div>
        <svg id="compass" viewBox="-50 -50 100 100" aria-label="Orientation"></svg>
      </div>
      <div id="sections" hidden>
        <div class="section main" data-plane="coronal"><canvas></canvas><div class="section-name"></div><div class="section-pos"></div></div>
        <div class="section side" data-plane="axial"><canvas></canvas><div class="section-name"></div><div class="section-pos"></div></div>
        <div class="section side" data-plane="sagittal"><canvas></canvas><div class="section-name"></div><div class="section-pos"></div></div>
      </div>
      <div id="toolbar" class="toolbar"></div>
      <div id="tour" class="tour" hidden></div>
      <div id="legend"></div>
      <div id="credits"></div>
      <div id="toast" role="status" hidden></div>
      <div id="loading">
        <div class="loading-inner">
          <svg class="mark" aria-hidden="true"><use href="#mark"/></svg>
          <p id="loading-text">Opening the atlas…</p>
          <div class="progress"><span id="loading-bar"></span></div>
        </div>
      </div>
    </section>

    <aside id="right" class="panel">
      <div id="card"></div>
    </aside>
  </main>

  <dialog id="about">
    <form method="dialog" tabindex="-1" autofocus>
      <div id="about-body"></div>
      <button class="link" value="close">Close</button>
    </form>
  </dialog>
</body>
</html>
