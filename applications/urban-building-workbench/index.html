<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Urban Building Workbench</title>
  <meta name="description" content="A three-dimensional GIS of cities — buildings, streets, holdings and their hours, pedestrian sensors — lit by the real Sun, with analyses of streets on top: rhythm, response to weather and holidays, mixing of uses, affinity and catalysis between stores, crowds as kinematic waves.">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M4 27 H28 M7 27 V13 L12 9 L17 13 V27 M17 27 V7 H25 V27' fill='none' stroke='%232f2427' stroke-width='1.6'/%3E%3Cpath d='M4 21 Q10 18 16 21 T28 21' fill='none' stroke='%234f8a8b' stroke-width='2'/%3E%3Ccircle cx='21' cy='11' r='1.8' fill='%23b4645a'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" media="print" onload="this.media='all'"
        href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,300..700;1,8..60,300..600&display=swap">
  <link rel="stylesheet" href="styles.css">
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
      }
    }
  </script>
  <script type="module" src="src/app.js"></script>
</head>
<body>
  <header class="top">
    <a class="brand" href="#">
      <svg viewBox="0 0 32 32" aria-hidden="true"><path class="frame" d="M4 27 H28 M7 27 V13 L12 9 L17 13 V27 M17 27 V7 H25 V27"/><path class="sea" d="M4 21 Q10 18 16 21 T28 21"/><circle class="dot" cx="21" cy="11" r="1.8"/></svg>
      <span>Urban Building Workbench</span>
    </a>
    <select id="area" title="the city shown"></select>
    <span class="where" id="where"></span>
    <span class="grow"></span>
    <span class="lamp" id="data-lamp" title="the data library's products">data</span>
    <span class="lamp" id="lamp" title="the engines">engine</span>
    <button class="plain" id="theme" title="day or night">night</button>
  </header>
  <nav class="rail" id="rail"></nav>
  <main id="main">
    <div id="map" class="map"></div>
    <div id="legend" class="legend-stack"></div>
    <div id="info" class="info" hidden></div>
    <div id="clock" class="clock"></div>
    <aside id="panel" class="panel-drawer" hidden></aside>
  </main>
  <div id="hover" class="hover" hidden></div>
</body>
</html>
