<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Genome Atlas</title>
  <meta name="description" content="Genomes drawn and computed: their maps and composition, the alignment of sequences as paths in a semiring, their indexes, the mapping and assembly of reads, the trees of their evolution and the genealogies of populations, on an engine that runs across processes and machines.">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='10.5' fill='none' stroke='%233a2830' stroke-width='1.6'/%3E%3Cpath d='M16 3.6A12.4 12.4 0 0 1 28.1 13.4' fill='none' stroke='%23a8577e' stroke-width='3' stroke-linecap='round'/%3E%3Cpath d='M26.6 21.6A12.4 12.4 0 0 1 9.8 26.8' fill='none' stroke='%23c9a043' stroke-width='3' stroke-linecap='round'/%3E%3Cpath d='M8.2 16.6A7.8 7.8 0 0 1 13.4 8.6' fill='none' stroke='%236e9c7a' stroke-width='2.4' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" media="print" onload="this.media='all'"
        href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,300..700;1,8..60,300..600&display=swap">
  <link rel="stylesheet" href="styles.css">
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
      }
    }
  </script>
  <script type="module" src="src/app.js"></script>
</head>
<body>
  <header class="top">
    <div class="brand">
      <svg class="mark" viewBox="0 0 32 32" aria-hidden="true">
        <circle cx="16" cy="16" r="10.5" fill="none" stroke="#3a2830" stroke-width="1.3"/>
        <path d="M16 3.6A12.4 12.4 0 0 1 28.1 13.4" fill="none" stroke="#a8577e" stroke-width="2.6" stroke-linecap="round"/>
        <path d="M26.6 21.6A12.4 12.4 0 0 1 9.8 26.8" fill="none" stroke="#c9a043" stroke-width="2.6" stroke-linecap="round"/>
        <path d="M8.2 16.6A7.8 7.8 0 0 1 13.4 8.6" fill="none" stroke="#6e9c7a" stroke-width="2" stroke-linecap="round"/>
        <path d="M16 1.6l1.6 2.6h-3.2z" fill="#3a2830"/>
      </svg>
      <div class="brand-text">
        <span class="brand-name">Genome Atlas</span>
        <span class="brand-sub">sequences, their alignments, assemblies and histories</span>
      </div>
    </div>
    <nav class="views" role="tablist" aria-label="Views">
      <button data-view="genome" role="tab">Genome</button>
      <button data-view="align" role="tab">Align</button>
      <button data-view="index" role="tab">Index</button>
      <button data-view="reads" role="tab">Reads</button>
      <button data-view="assembly" role="tab">Assembly</button>
      <button data-view="expression" role="tab">Expression</button>
      <button data-view="trees" role="tab">Trees</button>
      <button data-view="populations" role="tab">Populations</button>
      <button data-view="run" role="tab">Run</button>
    </nav>
    <div class="top-right">
      <span id="status" class="status" aria-live="polite"></span>
      <label class="genome-label">Genome <select id="genome" aria-label="The genome"></select></label>
      <button id="engine" class="engine" title="The engine and its workers">…</button>
    </div>
  </header>

  <main>
    <section id="view-genome" class="view view-genome"></section>
    <section id="view-align" class="view page" hidden></section>
    <section id="view-index" class="view page" hidden></section>
    <section id="view-reads" class="view page" hidden></section>
    <section id="view-assembly" class="view page" hidden></section>
    <section id="view-expression" class="view page" hidden></section>
    <section id="view-trees" class="view page" hidden></section>
    <section id="view-populations" class="view page" hidden></section>
    <section id="view-run" class="view page" hidden></section>
    <div id="notice" class="notice" hidden></div>
  </main>
  <div id="hover" class="hover" hidden></div>
</body>
</html>
